{% extends "auth_base.html" %}
{% block title %}Reset password{% endblock %}
{% block card %}
<h1>Reset your password</h1>
<p class="lede">Enter your email and we will send a link to choose a new password.</p>
<form class="auth-form" id="forgot-form" data-auth-form="forgot" novalidate>
  <div class="auth-msg error" role="alert" data-msg hidden></div>
  <div class="auth-msg ok" role="status" data-ok hidden></div>
  <div>
    <label for="email">Email</label>
    <input class="input" id="email" name="email" type="email" autocomplete="email" required autofocus>
  </div>
  <button class="btn btn-primary" type="submit">Send reset link</button>
</form>
<p class="auth-alt"><a href="/login">Back to sign in</a></p>
{% endblock %}

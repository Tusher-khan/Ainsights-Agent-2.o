{% extends "auth_base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block card %}
<h1>Choose a new password</h1>
<p class="lede">Pick something you have not used elsewhere.</p>
<form class="auth-form" id="reset-form" data-auth-form="reset" novalidate>
  <div class="auth-msg error" role="alert" data-msg hidden></div>
  <div class="auth-msg ok" role="status" data-ok hidden></div>
  <div>
    <label for="password">New password</label>
    <input class="input" id="password" name="password" type="password" autocomplete="new-password" required minlength="10" autofocus>
    <p class="auth-hint">Use at least 10 characters.</p>
  </div>
  <button class="btn btn-primary" type="submit">Change password</button>
</form>
<p class="auth-alt"><a href="/login">Back to sign in</a></p>
{% endblock %}
